name: Update GitHub Stats

on:
  schedule:
    # 每天 UTC 时间凌晨 3 点执行一次（北京时间上午11点）
    - cron: '0 3 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 需要写权限来提交生成的图片

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ========== Stats Card（统计卡片） ==========
      - name: Generate Stats Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: >-
            username=${{ github.repository_owner }}
            &show_icons=true
            &theme=transparent
            &hide_border=true
            &include_all_commits=true
            &count_private=true
          path: images/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ========== Top Languages Card（语言卡片） ==========
      - name: Generate Top Languages Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: >-
            username=${{ github.repository_owner }}
            &layout=compact
            &langs_count=8
            &theme=transparent
            &hide_border=true
            &count_private=true
          path: images/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ========== Repo Pin Card（仓库卡片，可选） ==========
      - name: Generate Repo Pin
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: >-
            username=${{ github.repository_owner }}
            &repo=my-awesome-project
            &theme=transparent
            &hide_border=true
          path: images/pin.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ========== 提交生成的图片 ==========
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/*.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update stats cards"
          git push
